services:
  - type: web
    name: web-tool-pdf
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: MAX_UPLOAD_MB
        value: 35
      - key: MAX_PDF_PAGES
        value: 120
      - key: MAX_CONCURRENT_JOBS
        value: 1
      - key: MAX_QUEUE_SIZE
        value: 3
      - key: REQUEST_TIMEOUT_MS
        value: 600000
      - key: NODE_OPTIONS
        value: --max-old-space-size=192
      - key: MEMORY_LOG_INTERVAL_MS
        value: 3000
      - key: MEMORY_WARNING_PERCENT
        value: 80
      - key: PROGRESS_LOG_EVERY_PAGES
        value: 5
      - key: JOB_RETENTION_MS
        value: 900000
      - key: JOB_CLEANUP_INTERVAL_MS
        value: 60000
      - key: MAX_STORED_JOBS
        value: 6

